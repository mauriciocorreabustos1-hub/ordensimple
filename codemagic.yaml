# Compila la app de OrdenSimple (carpeta mobile/) en Codemagic, en un Mac en la nube.
# iPhone: la sube a App Store Connect (TestFlight). Android: genera el .aab para Google Play.
# Lo que hay que crear una vez en Codemagic está en mobile/README.md.
workflows:
  ios-app-store:
    name: iPhone (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: OrdenSimple App Store Connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: cl.ordensimple.app
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias
        script: cd mobile && npm ci
      - name: Preparar el proyecto de iPhone
        script: cd mobile && npx cap sync ios
      - name: Firmar con el certificado de Apple
        script: xcode-project use-profiles
      - name: Número de compilación
        script: |
          cd mobile/ios/App
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          agvtool new-version -all $((LATEST + 1))
      - name: Compilar
        script: |
          xcode-project build-ipa \
            --workspace mobile/ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-google-play:
    name: Android (Google Play)
    # El plan gratis de Codemagic solo trae el Mac M2 (también compila Android).
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      android_signing:
        - ordensimple_keystore
      node: 22
      java: 21
    scripts:
      - name: Instalar dependencias
        script: cd mobile && npm ci
      - name: Preparar el proyecto de Android
        script: cd mobile && npx cap sync android
      - name: Compilar
        script: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew bundleRelease -PversionCode=$BUILD_NUMBER
    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
