<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>OrdenSimple</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: "Segoe UI", system-ui, sans-serif; background: #fff; color: #1f2937; text-align: center; padding: 24px; box-sizing: border-box; }
      button { margin-top: 16px; padding: 12px 20px; border: 0; border-radius: 12px; background: #007653; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div>
      <h1 style="font-size: 20px">No hay conexión a internet</h1>
      <p>OrdenSimple necesita internet para abrir tu negocio. Revisa tu conexión y vuelve a intentar.</p>
      <button onclick="location.href = new URLSearchParams(location.search).get('url') || 'https://www.ordensimple.cl/dashboard'">Volver a intentar</button>
    </div>
  </body>
</html>
